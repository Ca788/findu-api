services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine

  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"

  web:
    build: .
    command:
      - bash
      - -c
      - >-
        flock /usr/local/bundle/.bundle-sync.lock bash -c 'bundle config unset without || true; bundle check || bundle install --jobs 4 --retry 3'
        && rm -f tmp/pids/server.pid
        && bundle exec rails db:prepare
        && bundle exec rails server -b 0.0.0.0 -p 8080
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:8080"
    depends_on:
      - db
      - redis
      - maildev
    env_file: .env
    environment:
      RAILS_ENV: development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://postgres:postgres@db:5432/findu_development
      MAILER_URL_CALLBACK: localhost
      MAILER_URL_CALLBACK_PORT: 3000
      MAILER_ADDRESS: maildev
      MAILER_PORT: 1025
      MAILER_DOMAIN: example.com
      FRONTEND_ORIGIN: http://localhost:5147,http://127.0.0.1:5147

  sidekiq:
    build: .
    command:
      - bash
      - -c
      - >-
        flock /usr/local/bundle/.bundle-sync.lock bash -c 'bundle config unset without || true; bundle check || bundle install --jobs 4 --retry 3'
        && bundle exec sidekiq
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      - db
      - redis
      - maildev
    env_file: .env
    environment:
      RAILS_ENV: development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://postgres:postgres@db:5432/findu_development
      MAILER_URL_CALLBACK: localhost
      MAILER_URL_CALLBACK_PORT: 3000
      MAILER_ADDRESS: maildev
      MAILER_PORT: 1025
      MAILER_DOMAIN: example.com

volumes:
  postgres_data:
  bundle_cache:
