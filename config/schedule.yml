generate_ai_insights:
  cron: "<%= ENV.fetch('INSIGHTS_CRON', '0 6 * * * America/Sao_Paulo') %>"
  class: "Intelligence::EnqueueInsightsJob"
  queue: insights
  description: "Gera insights financeiros via IA para cada usuário ativo."

sweep_stale_chat_messages:
  cron: "<%= ENV.fetch('CHAT_SWEEP_CRON', '*/5 * * * *') %>"
  class: "Chat::SweepStaleMessagesJob"
  queue: default
  description: "Encerra mensagens de chat presas em processing quando o worker morre no meio."

notify_due_entries:
  cron: "0 8 * * * America/Sao_Paulo"
  class: "Notifications::NotifyDueEntriesJob"
  queue: default
  description: "Notifica contas que vencem hoje, nos próximos 3 dias ou já atrasadas."

notify_ending_installments:
  cron: "0 8 * * * America/Sao_Paulo"
  class: "Notifications::NotifyEndingInstallmentsJob"
  queue: default
  description: "Notifica parcelamentos com 1 ou 2 parcelas restantes."

notify_idle_users:
  cron: "0 10 * * 1 America/Sao_Paulo"
  class: "Notifications::NotifyIdleUsersJob"
  queue: default
  description: "Lembrete semanal para quem não registrou lançamentos nos últimos 7 dias."

materialize_future_entries:
  cron: "30 3 * * * America/Sao_Paulo"
  class: "Financial::MaterializeFutureEntriesJob"
  queue: default
  description: "Materializa recorrências futuras e conclui parcelamentos quitados."

purge_stale_device_tokens:
  cron: "0 4 * * 0 America/Sao_Paulo"
  class: "Notifications::PurgeStaleDeviceTokensJob"
  queue: default
  description: "Remove device tokens sem atividade há 60 dias."

notify_daily_register_morning:
  cron: "0 8 * * * America/Sao_Paulo"
  class: "Notifications::NotifyDailyRegisterJob"
  queue: default
  args:
    - morning
  description: "Lembrete das 8h para planejar o dia e registrar despesas."

notify_daily_register_noon:
  cron: "0 12 * * * America/Sao_Paulo"
  class: "Notifications::NotifyDailyRegisterJob"
  queue: default
  args:
    - noon
  description: "Lembrete das 12h para registrar as despesas da manhã."
